<div class="app" id="app">
  <header class="appbar">
    <button class="ibtn" id="btnBack" aria-label="Kembali" data-i18n-aria="common.back" hidden><svg class="svg-i"><use href="#i-back"/></svg></button>
    <button class="logo" id="btnLogo" aria-label="Beranda Klipora" data-i18n-aria="app.homeAria"><svg class="svg-i"><use href="#i-logo"/></svg></button>
    <button class="searchbtn" id="btnSearch" aria-label="Cari alat atau aksi (Ctrl K)" data-i18n-aria="app.searchAria"><svg class="svg-i"><use href="#i-search"/></svg><span data-i18n="app.search">Cari alat atau aksi</span><span class="kbd">Ctrl K</span></button>
    <button class="crumb" id="btnCrumb" aria-haspopup="dialog" aria-label="Ganti alat (Ctrl K)" data-i18n-aria="app.switchToolAria" hidden><span class="crumb-group" id="crumbGroup" hidden></span><span class="crumb-title" id="crumbTitle"></span><svg class="svg-i"><use href="#i-chev-d"/></svg></button>
    <button class="ibtn" id="btnJobs" aria-label="Riwayat dan proses berjalan" data-i18n-aria="app.jobsAria"><svg class="jobring" viewBox="0 0 22 22" id="jobRing" hidden><circle class="bgc" cx="11" cy="11" r="9"/><circle class="fgc" cx="11" cy="11" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg><svg class="svg-i"><use href="#i-clock"/></svg></button>
    <button class="ibtn" id="btnSettings" aria-label="Pengaturan" data-i18n-aria="app.settings"><svg class="svg-i"><use href="#i-sliders"/></svg></button>
  </header>
  <nav class="subnav" id="subnav" role="tablist" aria-label="Alat dalam grup ini" data-i18n-aria="app.subnavAria" hidden></nav>
  <main class="view" id="view">
    <div class="boot" id="boot" data-i18n="app.loading">Memuat Klipora...</div>
  </main>
  <footer class="dock" id="dock"></footer>
</div>

<!-- Command palette + shortcut sheet -->
<div class="overlay" id="ovPalette" role="dialog" aria-modal="true" aria-label="Cari alat atau aksi" data-i18n-aria="app.search">
  <div class="palette">
    <div class="pal-in"><svg class="svg-i"><use href="#i-search"/></svg><input id="palInput" placeholder="Cari alat, resep, atau aksi" data-i18n-ph="palette.placeholder" autocomplete="off" spellcheck="false" aria-controls="palList" aria-label="Cari" data-i18n-aria="common.search"><span class="kbd">Esc</span></div>
    <div class="pal-list" id="palList" role="listbox" aria-label="Hasil" data-i18n-aria="palette.results"></div>
    <div class="pal-foot"><span><span class="kbd">&#8593;&#8595;</span> <span data-i18n="palette.footSelect">pilih</span></span><span><span class="kbd">Enter</span> <span data-i18n="palette.footOpen">buka</span></span><span><span class="kbd">?</span> <span data-i18n="palette.footKeys">pintasan</span></span></div>
  </div>
</div>
<div class="overlay" id="ovKeys" role="dialog" aria-modal="true" aria-label="Pintasan keyboard" data-i18n-aria="keys.title">
  <div class="sheet">
    <div class="sheet-h"><b data-i18n="keys.title">Pintasan keyboard</b><button class="ibtn" data-close aria-label="Tutup" data-i18n-aria="common.close"><svg class="svg-i"><use href="#i-x"/></svg></button></div>
    <div class="sheet-body" id="keysBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
